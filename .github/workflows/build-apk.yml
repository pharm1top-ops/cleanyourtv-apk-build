name: Build CleanYourTV launcher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get cleanyourtv v2.5.0 source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: v2.5.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk tvhome-2.5.0.apk
          gh release delete v2.5.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create v2.5.0 tvhome-2.5.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "CleanYourTV launcher 2.5.0" \
            --notes "Built from https://github.com/Gathin23/cleanyourtv tag v2.5.0, unmodified. Debug-signed, sideload over ADB only."
